name: Finance transaction controls and legacy reserve repair
on:
  push:
    branches:
      - finance-transaction-delete-legacy-reserve-fix
    paths:
      - .github/workflows/finance-transaction-delete-legacy-reserve-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finance-transaction-delete-legacy-reserve-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Finance patch
        run: python scripts/finance-transaction-control-fix.py
      - name: Align direct service worker release
        run: sed -i 's/0.13.2-finance-planning-deficit-20260808/0.13.3-finance-transaction-control-20260808/g' js/app.js
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/finance-core.js js/app.js css/mobile-finance.css tests/finance-part2-regression.test.cjs tests/app-static.test.cjs index.html js/update-manager.js service-worker.js manifest.json version.json
          git commit -m 'Add transaction deletion controls and legacy reserve balance repair'
          git rm .github/workflows/finance-transaction-delete-legacy-reserve-fix.yml scripts/finance-transaction-control-fix.py
          git commit -m 'Remove temporary Finance repair tooling'
          git push origin HEAD:finance-transaction-delete-legacy-reserve-fix
