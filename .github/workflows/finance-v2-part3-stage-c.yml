name: Finance v2 Part3 Stage C
on:
  push:
    branches: [finance-v2-part3-work]
permissions:
  contents: write
jobs:
  stage-c:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finance-v2-part3-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply stage C
        run: python3 scripts/finance-v2-part3-stage-c.py
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build check
        run: npm run build
      - name: Commit stage C
        run: |
          rm -f scripts/finance-v2-part3-stage-c.py .github/workflows/finance-v2-part3-stage-c.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finance v2 Part3 C: account reconciliation'
          git push origin HEAD:finance-v2-part3-work
