name: Finance v2 Part3 Final
on:
  push:
    branches: [finance-v2-part3-work]
permissions:
  contents: write
jobs:
  final:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finance-v2-part3-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final release
        run: python3 scripts/finance-v2-part3-stage-g.py
      - name: Test Parts 1-3
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build check
        run: npm run build
      - name: Verify final architecture
        run: |
          test ! -e js/finance-module-v1.js
          test ! -e js/finance-module-v2.js
          test ! -e js/finance-module-v3.js
          grep -q "0.13.0-finance-v2-complete-20260807" index.html
          grep -q "0.13.0-finance-v2-complete-20260807" service-worker.js
          grep -q "0.13.0-finance-v2-complete-20260807" version.json
          grep -q "const FINANCE_SCHEMA_VERSION=3" js/finance-core.js
          grep -q "const STORAGE_KEY = 'tsb_hub_data_v1'" js/app.js
      - name: Commit final Finance v2
        run: |
          rm -f scripts/finance-v2-part3-stage-g.py .github/workflows/finance-v2-part3-stage-g.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finance v2 complete: analytics reconciliation export and polish'
          git push origin HEAD:finance-v2-part3-work
