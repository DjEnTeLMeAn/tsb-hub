name: Finance mobile overflow fix

on:
  push:
    branches: [finance-mobile-overflow-fix]
    paths:
      - 'css/mobile-finance.css'
      - '.github/workflows/finance-mobile-overflow-fix.yml'

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finance-mobile-overflow-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare bugfix release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone, timedelta

          old_release='0.13.0-finance-v2-complete-20260807'
          new_release='0.13.1-finance-mobile-fix-20260808'
          old_short='0.13.0-finance-v2-complete'
          new_short='0.13.1-finance-mobile-fix'
          files=[
              'index.html','js/update-manager.js','service-worker.js',
              'manifest.json','version.json','tests/app-static.test.cjs','js/app.js'
          ]
          for name in files:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              text=text.replace(old_release,new_release).replace(old_short,new_short)
              if name=='index.html':
                  text=text.replace('<title>TSB Hub v0.13.0</title>','<title>TSB Hub v0.13.1</title>')
              p.write_text(text,encoding='utf-8')

          version=Path('version.json')
          data=json.loads(version.read_text(encoding='utf-8'))
          data['release']=new_release
          data['publishedAt']=datetime.now(timezone(timedelta(hours=5))).isoformat(timespec='seconds')
          data['cache']='tsb-hub-'+new_release
          version.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Test application
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build check
        run: npm run build
      - name: Verify responsive Finance contract
        run: |
          grep -Fq '.finance-v2-account{display:grid;grid-template-columns:minmax(0,1fr) auto' css/mobile-finance.css
          grep -Fq '.finance-v2-manage-item{display:grid;grid-template-columns:minmax(0,1fr) auto' css/mobile-finance.css
          grep -Fq '.finance-v2-account .actions{display:flex!important' css/mobile-finance.css
          grep -Fq '.finance-v2-filter-row{flex-wrap:wrap;overflow-x:visible}' css/mobile-finance.css
          grep -Fq "const RELEASE='0.13.1-finance-mobile-fix-20260808'" service-worker.js
          grep -Fq '0.13.1-finance-mobile-fix-20260808' index.html
          test ! -e js/finance-module-v1.js
          test ! -e js/finance-module-v2.js
          test ! -e js/finance-module-v3.js
      - name: Commit verified bugfix
        run: |
          rm -f .github/workflows/finance-mobile-overflow-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release v0.13.1 Finance mobile overflow fix'
          git push origin HEAD:finance-mobile-overflow-fix
