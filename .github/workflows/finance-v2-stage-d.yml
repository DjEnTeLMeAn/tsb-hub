name: Finance v2 Stage D
on:
  push:
    branches: [finance-v2-part1-work]
    paths:
      - 'scripts/finance-v2-stage-d.py'
      - '.github/workflows/finance-v2-stage-d.yml'
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finance-v2-part1-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply stage D
        run: python3 scripts/finance-v2-stage-d.py
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build check
        run: npm run build
      - name: Commit stage D result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js index.html package.json tests/app-static.test.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'Finance v2 part1 D: integrate migration and Today quick expense'
            git push origin HEAD:finance-v2-part1-work
          fi
