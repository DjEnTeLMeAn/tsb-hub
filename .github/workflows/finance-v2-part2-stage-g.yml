name: Finance v2 Part2 Stage G
on:
  push:
    branches: [finance-v2-part2-work]
permissions:
  contents: write
jobs:
  stage-g:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finance-v2-part2-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply stage G
        run: python3 scripts/finance-v2-part2-stage-g.py
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build check
        run: npm run build
      - name: Verify architecture and temporary cleanup target
        run: |
          test ! -e js/finance-module-v1.js
          test ! -e js/finance-module-v2.js
          grep -q "0.12.0-finance-v2-part2-20260807" index.html
          grep -q "0.12.0-finance-v2-part2-20260807" service-worker.js
          grep -q "0.12.0-finance-v2-part2-20260807" version.json
      - name: Commit stage G
        run: |
          rm -f scripts/finance-v2-part2-stage-g.py .github/workflows/finance-v2-part2-stage-g.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finance v2 Part2 G: regressions report alignment and release'
          git push origin HEAD:finance-v2-part2-work
