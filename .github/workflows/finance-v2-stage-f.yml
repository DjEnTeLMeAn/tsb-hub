name: Finance v2 Stage F
on:
  push:
    branches: [finance-v2-part1-work]
    paths:
      - 'scripts/finance-v2-stage-f.py'
      - '.github/workflows/finance-v2-stage-f.yml'
permissions:
  contents: write
jobs:
  finalize-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finance-v2-part1-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply stage F and cleanup
        run: python3 scripts/finance-v2-stage-f.py
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build check
        run: npm run build
      - name: Verify no legacy or temporary implementation files
        run: |
          test ! -e js/finance-module-v1.js
          test ! -e scripts/finance-v2-stage-c.mjs
          test ! -e scripts/finance-v2-stage-d.py
          test ! -e scripts/finance-v2-stage-e.py
          test ! -e scripts/finance-v2-stage-f.py
      - name: Commit final Part 1 result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finance v2 part1 F: unified history and final cleanup'
          git push origin HEAD:finance-v2-part1-work
