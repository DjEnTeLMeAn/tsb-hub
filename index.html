<body>
  <div class="app-shell">
    <header class="app-header">
      <h1 id="currentSectionTitle">Tasks</h1>
      <button class="icon-button profile-settings-button" type="button" data-tab-target="settings" aria-label="Открыть настройки" title="Настройки">⚙</button>
    </header>
    <div class="date-navigation-row">
      <div class="date-switcher" aria-label="Выбранная дата">
        <button class="icon-button" id="prevDayBtn" title="Предыдущий день">‹</button>
        <button class="date-pill" id="openCalendarBtn" title="Открыть календарь"><span id="selectedDateLabel">—</span><span class="date-pill-hint">календарь</span></button>
        <button class="icon-button" id="nextDayBtn" title="Следующий день">›</button>
      </div>
    </div>
    <main class="layout">
      <aside class="side-panel" aria-label="Боковая панель">
        <section class="card mini-calendar-card"><div class="card-title-row"><h2>Календарь</h2><button class="ghost-button small" id="todayBtn">Сегодня</button></div><div id="desktopCalendar"></div></section>
        <section class="card"><div class="card-title-row"><h2>Ближайшее</h2><button class="ghost-button small" data-tab-target="tasks">Все</button></div><div id="sideImportantList" class="compact-list"></div></section>
      </aside>
      <section class="content-panel">
        <nav class="tabs" aria-label="Основные разделы приложения">
          <button class="tab-button primary-destination active" data-tab="tasks" aria-label="Задачи">Задачи</button>
          <button class="tab-button primary-destination" data-tab="food">Питание</button>
          <button class="tab-button primary-destination" data-tab="finance">Финансы</button>
        </nav>
        <div class="tab-page active" id="tab-tasks"></div>
        <div class="tab-page" id="tab-food"></div>
        <div class="tab-page" id="tab-finance"></div>
        <div class="tab-page" id="tab-settings"><section class="card settings-card"><div class="card-title-row"><h2>Настройки</h2></div><p class="muted">Настройки загружаются через JavaScript.</p></section></div>
      </section>
    </main>
  </div>
  <div class="mobile-tab-fab" id="mobileTabFab" aria-label="Разделы">
    <button class="mobile-tab-button settings-nav-button" id="mobileTabToggle" type="button" aria-expanded="false" aria-label="Настройки и дополнительные разделы" title="Настройки и дополнительные разделы">⚙</button>
    <div class="mobile-tab-menu" id="mobileTabMenu" aria-hidden="true">
      <button data-tab-target="tasks">Задачи</button>
      <button data-tab-target="food">Питание</button>
      <button data-tab-target="finance">Финансы</button>
    </div>
  </div>
  <dialog id="calendarDialog" class="modal-dialog"><div class="modal-card"><div class="card-title-row"><h2>Выбор даты</h2><button class="icon-button" id="closeCalendarBtn" aria-label="Закрыть">×</button></div><div id="mobileCalendar"></div></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script defer src="js/update-manager.js?v=0.13.4-task-card-fix-20260831"></script>
  <script defer src="js/finance-core.js?v=0.13.4-task-card-fix-20260831"></script>
  <script defer src="js/storage.js?v=0.13.4-task-card-fix-20260831"></script>
  <script defer src="js/app.js?v=0.13.4-task-card-fix-20260831"></script>
  <script defer src="js/mobile-first-cleanup.js?v=0.13.4-task-card-fix-20260831"></script>
  <script defer src="js/mobile-dashboard.js?v=0.13.4-task-card-fix-20260831"></script>
</body>
</html>
